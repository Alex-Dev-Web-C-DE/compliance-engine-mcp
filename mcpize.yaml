version: 1
runtime: typescript
entry: src/index.ts

build:
  install: npm install
  command: npm run build

startCommand:
  type: http
  command: node dist/index.js

configSchema:
  source: code

pricing:
  protocol: "x402"
  network: "base"
  recipient: "0x47fde85a66921257edbB8189d839217E2380Bf6e"
  asset: "usdc"
  tools:
    - name: "check_sanctions"
      price: "0.01"
      description: "Screen against OFAC/UK/EU/UN sanctions lists"
    - name: "check_pep"
      price: "0.01"
      description: "Politically Exposed Person check"
    - name: "check_entity"
      price: "0.01"
      description: "Legal entity lookup in GLEIF"